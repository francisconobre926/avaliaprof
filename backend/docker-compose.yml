name: avaliaprof

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: avaliaprof
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: avaliaprof
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - avaliaprof_data:/var/lib/postgresql/data

volumes:
  avaliaprof_data:
